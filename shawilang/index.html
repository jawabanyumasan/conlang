<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Shawilang – Shawibet Writer & Translator</title>
    <meta name="description" content="Tulis dan konversi Bahasa Indonesia ke Shawilang dan aksara Shawibet dengan mode Ngoko, Kromo, dan Kromo Ngalik.">
    <link rel="canonical" href="https://wahyudi.github.io/shawilang/">
    <meta property="og:title" content="Shawilang – Shawibet Writer">
    <meta property="og:description" content="Konversi Bahasa Indonesia ke Shawilang & Shawibet. Mode Ngoko, Kromo, Kromo Ngalik. PWA.">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𐑖</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <style>
        /* CSS Variables */
        :root {
            --bg: #ffffff;
            --bg-card: #f8fafc;
            --text: #0f172a;
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --accent: #f97316;
            --border: #cbd5e1;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius: 12px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --accent: #f97316;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 16px 20px;
            line-height: 1.5;
        }
        /* header */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 8px;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 20px;
        }
        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .brand small {
            display: block;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .theme-toggle:hover { opacity: 0.8; }

        /* controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            background: var(--bg-card);
            padding: 16px 18px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px 12px;
            flex-wrap: wrap;
        }
        .control-group label {
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .btn-group {
            display: flex;
            gap: 4px;
            background: var(--bg);
            border-radius: 40px;
            padding: 3px;
            border: 1px solid var(--border);
        }
        .btn-group button {
            background: transparent;
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: 0.15s;
            white-space: nowrap;
        }
        .btn-group button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(30,58,138,0.3);
        }
        .btn-group button:not(.active):hover { background: var(--border); }

        select, .btn-ghost {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
        }
        .btn-ghost {
            background: var(--bg-card);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-ghost:hover { background: var(--border); }

        /* layout columns */
        .columns {
            display: grid;
            gap: 16px;
            margin-bottom: 16px;
        }
        .col-2 { grid-template-columns: 1fr 1fr; }
        .col-3 { grid-template-columns: 1fr 1fr 1fr; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .card-header label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .card-actions button {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text);
            opacity: 0.6;
            transition: 0.15s;
        }
        .card-actions button:hover { opacity: 1; background: var(--border); }
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
            font-family: var(--font);
            transition: 0.2s;
            line-height: 1.6;
        }
        textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        .char-count {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .rtl-text {
            direction: rtl;
            unicode-bidi: plaintext;
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        /* toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* responsive */
        @media (max-width: 720px) {
            .col-2, .col-3 { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
            .control-group { justify-content: center; }
            .brand h1 { font-size: 1.5rem; }
            .btn-group button { font-size: 0.7rem; padding: 4px 10px; }
        }
        @media (max-width: 480px) {
            header { flex-direction: column; align-items: start; gap: 6px; }
            .header-actions { width: 100%; justify-content: flex-start; }
        }
        .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .gap-1 { gap: 4px; }
        .mt-1 { margin-top: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>SHAWILANG</h1>
            <small>Shawilang &amp; Shawibet Writer</small>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle tema">🌙 Dark</button>
        </div>
    </header>

    <!-- controls -->
    <div class="controls" id="controls">
        <div class="control-group">
            <label>Mode</label>
            <div class="btn-group" id="modeGroup">
                <button data-mode="latin2shawi" class="active">Latin → Shawibet</button>
                <button data-mode="shawi2latin">Shawibet → Latin</button>
            </div>
        </div>
        <div class="control-group">
            <label>Layout</label>
            <div class="btn-group" id="layoutGroup">
                <button data-layout="2" class="active">2 Kolom</button>
                <button data-layout="3">3 Kolom</button>
            </div>
        </div>
        <div class="control-group">
            <label>Kerumitan</label>
            <div class="btn-group" id="complexityGroup">
                <button data-complex="ngoko" class="active">Ngoko</button>
                <button data-complex="kromo">Kromo</button>
                <button data-complex="kromo-ngalik">Kromo Ngalik</button>
            </div>
        </div>
        <div class="control-group">
            <button class="btn-ghost" id="swapBtn">⇄ Tukar</button>
            <button class="btn-ghost" id="clearBtn">✕ Bersihkan</button>
        </div>
    </div>

    <!-- columns container -->
    <div class="columns col-2" id="columnsContainer">
        <!-- column 1 : input -->
        <div class="card" id="col1">
            <div class="card-header">
                <label id="labelCol1">Input Latin</label>
                <div class="card-actions">
                    <button class="copy-btn" data-target="col1" aria-label="Salin">📋</button>
                    <span class="char-count" id="countCol1">0</span>
                </div>
            </div>
            <textarea id="inputText" placeholder="Ketik di sini..." spellcheck="true"></textarea>
        </div>
        <!-- column 2 : hasil utama -->
        <div class="card" id="col2">
            <div class="card-header">
                <label id="labelCol2">Hasil Shawibet</label>
                <div class="card-actions">
                    <button class="copy-btn" data-target="col2" aria-label="Salin">📋</button>
                    <span class="char-count" id="countCol2">0</span>
                </div>
            </div>
            <textarea id="outputShawibet" readonly placeholder="Hasil aksara"></textarea>
        </div>
        <!-- column 3 : shawilang latin (opsional) -->
        <div class="card hidden" id="col3">
            <div class="card-header">
                <label id="labelCol3">Shawilang Latin</label>
                <div class="card-actions">
                    <button class="copy-btn" data-target="col3" aria-label="Salin">📋</button>
                    <span class="char-count" id="countCol3">0</span>
                </div>
            </div>
            <textarea id="outputLatin" readonly placeholder="Hasil Shawilang Latin"></textarea>
        </div>
    </div>

    <!-- additional info -->
    <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-top:6px;">
        <div style="font-size:0.8rem; opacity:0.7;">
            <span id="modeDesc">Mode: Latin → Shawibet · Ngoko · LTR</span>
        </div>
        <button class="btn-ghost" id="convertBtn" style="background:var(--primary); color:white; border:none; padding:8px 24px;">Konversi</button>
    </div>

    <div class="footer">
        Developed By Wahyudi © <span id="year"></span>
    </div>

    <!-- toast -->
    <div id="toast" class="toast">✓ Berhasil disalin</div>

    <script>
        (function(){
            "use strict";

            // ---------- SHAWILANG MAPPING (UPDATED) ----------
            // Mapping untuk transformasi (per huruf)
            const CHAR_MAP = {
                'b':'p', 'p':'p', 'c':'j', 'j':'c', 'd':'t', 't':'d',
                'f':'v', 'v':'f', 'h':'ng', 'ng':'h', 'k':'g', 'g':'k',
                'l':'r', 'r':'l', 'm':'n', 'n':'m', 's':'z', 'z':'s',
                'w':'y', 'y':'w', 'a':'e', 'e':'a', 'u':'o', 'o':'u'
            };
            // Huruf yang TIDAK diubah untuk semua level
            const UNCHANGED = ['i','ny','sy','q','x'];

            // Tokenizer: longest match untuk multi-char (ng, ny, sy, kh? kh tidak di map sekarang)
            function tokenize(input) {
                const tokens = [];
                const special = ['ng','ny','sy']; // kh tidak digunakan
                let i = 0;
                while(i < input.length) {
                    let match = null;
                    if(i+1 < input.length) {
                        const two = input.substr(i,2).toLowerCase();
                        if(special.includes(two)) {
                            match = two;
                        }
                    }
                    if(match) {
                        tokens.push(match);
                        i += 2;
                    } else {
                        const ch = input[i].toLowerCase();
                        tokens.push(ch);
                        i++;
                    }
                }
                return tokens;
            }

            // Transformasi per kata (level 1 dan 2)
            function transformWord(text) {
                const tokens = tokenize(text);
                let result = '';
                for(let t of tokens) {
                    // cek apakah termasuk unchanged
                    if(UNCHANGED.includes(t)) {
                        result += t;
                        continue;
                    }
                    // mapping
                    const mapped = CHAR_MAP[t];
                    if(mapped) {
                        result += mapped;
                    } else {
                        result += t; // fallback
                    }
                }
                return result;
            }

            // Kromo Ngalik: transformasi tanpa m,n,s,w,y,z? sesuai spesifikasi: 
            // level 3 tidak mengubah m,n,s,w,y,z? spesifikasi baru: hanya mengubah b<->p, c<->j, d<->t, f<->v, h<->ng, k<->g, l<->r, a<->e, u<->o
            // tidak menyebut m,n,s,w,y,z, i, ny, sy, q, x
            const CHAR_MAP_LEVEL3 = {
                'b':'p', 'p':'p', 'c':'j', 'j':'c', 'd':'t', 't':'d',
                'f':'v', 'v':'f', 'h':'ng', 'ng':'h', 'k':'g', 'g':'k',
                'l':'r', 'r':'l', 'a':'e', 'e':'a', 'u':'o', 'o':'u'
            };
            const UNCHANGED_LEVEL3 = ['i','m','n','s','w','y','z','ny','sy','q','x'];

            function transformWordLevel3(text) {
                const tokens = tokenize(text);
                let result = '';
                for(let t of tokens) {
                    if(UNCHANGED_LEVEL3.includes(t)) {
                        result += t;
                        continue;
                    }
                    const mapped = CHAR_MAP_LEVEL3[t];
                    if(mapped) {
                        result += mapped;
                    } else {
                        result += t;
                    }
                }
                return result;
            }

            // Shawibet encoding (UPDATED)
            const SHAWI_MAP = {
                'p':'𐑐','b':'𐑚','t':'𐑑','d':'𐑛','k':'𐑒','g':'𐑜',
                'v':'𐑓','f':'𐑝','s':'𐑕','z':'𐑟','c':'𐑗','j':'𐑡',
                'y':'𐑘','w':'𐑢','ng':'𐑙','h':'𐑣','l':'𐑤','r':'𐑮',
                'm':'𐑥','n':'𐑯','e':'𐑧','a':'𐑪','i':'𐑴','o':'𐑺','u':'𐑻',
                'q':'ф','x':'x','sy':'$','ny':'𐑰'
            };
            // Decode map
            const SHAWI_DECODE = Object.fromEntries(Object.entries(SHAWI_MAP).map(([k,v])=>[v,k]));

            // encode ke Shawibet
            function encodeShawibet(latinText) {
                let result = '';
                let i=0;
                while(i<latinText.length) {
                    // cek multi-char tokens
                    let matched = false;
                    for(let len=2; len>=1; len--) {
                        if(i+len <= latinText.length) {
                            const sub = latinText.substr(i,len);
                            const lower = sub.toLowerCase();
                            if(SHAWI_MAP[lower]) {
                                result += SHAWI_MAP[lower];
                                i += len;
                                matched = true;
                                break;
                            }
                        }
                    }
                    if(!matched) {
                        const ch = latinText[i];
                        if(ch === ' ') result += ' ';
                        else if(/[.,!?;:"'()\-]/.test(ch)) result += ch;
                        else result += ch; // fallback
                        i++;
                    }
                }
                return result;
            }

            // decode Shawibet
            function decodeShawibet(shawiText) {
                let result = '';
                let i=0;
                while(i<shawiText.length) {
                    let found = false;
                    // coba match terpanjang di map
                    for(let len=3; len>=1; len--) {
                        if(i+len <= shawiText.length) {
                            const sub = shawiText.substr(i,len);
                            if(SHAWI_DECODE[sub]) {
                                result += SHAWI_DECODE[sub];
                                i += len;
                                found = true;
                                break;
                            }
                        }
                    }
                    if(!found) {
                        const ch = shawiText[i];
                        if(ch === ' ' || /[.,!?;:"'()\-]/.test(ch)) result += ch;
                        else result += ch;
                        i++;
                    }
                }
                return result;
            }

            // Pipeline untuk Ngoko dan Kromo (level 1 & 2)
            function applyNgoko(text) {
                return text.split(/\b/).map(part => {
                    if(/^[A-Za-z]+$/.test(part)) return transformWord(part);
                    return part;
                }).join('');
            }

            function applyKromo(text) {
                return text.split(/\b/).map(part => {
                    if(/^[A-Za-z]+$/.test(part)) {
                        const tr = transformWord(part);
                        return tr.split('').reverse().join('');
                    }
                    return part;
                }).join('');
            }

            // Kromo Ngalik: transform level3 + reverse karakter + reverse urutan kata
            function applyKromoNgalik(text) {
                const words = text.split(/\s+/);
                const processed = words.map(w => {
                    if(/^[A-Za-z]+$/.test(w)) {
                        const tr = transformWordLevel3(w);
                        return tr.split('').reverse().join('');
                    }
                    return w;
                });
                // reverse urutan kata
                return processed.reverse().join(' ');
            }

            // ---------- APP STATE ----------
            const state = {
                mode: 'latin2shawi',
                layout: 2,
                complexity: 'ngoko',
                inputText: 'buku itu baru',
                outputShawibet: '',
                outputLatin: '',
                isRTL: false,
            };

            // DOM refs
            const $ = id => document.getElementById(id);
            const inputText = $('inputText');
            const outputShawibet = $('outputShawibet');
            const outputLatin = $('outputLatin');
            const col1 = $('col1');
            const col2 = $('col2');
            const col3 = $('col3');
            const labelCol1 = $('labelCol1');
            const labelCol2 = $('labelCol2');
            const labelCol3 = $('labelCol3');
            const countCol1 = $('countCol1');
            const countCol2 = $('countCol2');
            const countCol3 = $('countCol3');
            const modeDesc = $('modeDesc');
            const toast = $('toast');

            // ---------- ENGINE ----------
            function runConversion() {
                const raw = inputText.value;
                state.inputText = raw;
                const mode = state.mode;
                const comp = state.complexity;
                let shawiResult = '';
                let latinResult = '';
                let isRTL = false;

                if(mode === 'latin2shawi') {
                    let shawilang = '';
                    if(comp === 'ngoko') {
                        shawilang = applyNgoko(raw);
                    } else if(comp === 'kromo') {
                        shawilang = applyKromo(raw);
                    } else { // kromo-ngalik
                        shawilang = applyKromoNgalik(raw);
                        isRTL = true;
                    }
                    latinResult = shawilang;
                    shawiResult = encodeShawibet(shawilang);
                } else {
                    // shawi2latin
                    const decoded = decodeShawibet(raw);
                    let original = decoded.split(/\b/).map(part => {
                        if(/^[A-Za-z]+$/.test(part)) {
                            // balik transformasi: gunakan transformWord (simetris)
                            return transformWord(part);
                        }
                        return part;
                    }).join('');
                    if(comp === 'ngoko') {
                        latinResult = original;
                        shawiResult = raw;
                    } else if(comp === 'kromo') {
                        const reversedWords = original.split(/\b/).map(part => {
                            if(/^[A-Za-z]+$/.test(part)) return part.split('').reverse().join('');
                            return part;
                        }).join('');
                        latinResult = reversedWords;
                        shawiResult = raw;
                    } else {
                        // kromo-ngalik: reverse sentence
                        const words = original.split(/\s+/);
                        const reversed = words.map(w => w.split('').reverse().join('')).reverse().join(' ');
                        latinResult = reversed;
                        shawiResult = raw;
                        isRTL = true;
                    }
                }

                state.outputLatin = latinResult;
                state.outputShawibet = shawiResult;
                state.isRTL = isRTL;

                outputShawibet.value = shawiResult;
                outputLatin.value = latinResult;

                // handle RTL
                outputShawibet.classList.toggle('rtl-text', isRTL && state.mode==='latin2shawi');
                if(state.mode==='shawi2latin' && state.complexity==='kromo-ngalik') {
                    outputShawibet.classList.add('rtl-text');
                } else {
                    outputShawibet.classList.remove('rtl-text');
                }

                updateLabelsAndCounts();
                updateModeDesc();
            }

            function updateLabelsAndCounts() {
                const mode = state.mode;
                const layout = state.layout;
                const is3 = layout === 3;
                col3.classList.toggle('hidden', !is3);
                if(mode==='latin2shawi') {
                    labelCol1.textContent = 'Input Latin';
                    labelCol2.textContent = 'Shawibet';
                    labelCol3.textContent = 'Shawilang Latin';
                } else {
                    labelCol1.textContent = 'Input Shawibet';
                    labelCol2.textContent = 'Hasil Latin (Shawilang)';
                    labelCol3.textContent = 'Hasil Indonesia';
                }
                countCol1.textContent = inputText.value.length;
                countCol2.textContent = outputShawibet.value.length;
                countCol3.textContent = outputLatin.value.length;
            }

            function updateModeDesc() {
                const comp = state.complexity;
                const mode = state.mode;
                let dir = 'LTR';
                if(state.isRTL) dir = 'RTL (Shawibet)';
                const compName = { 'ngoko':'Ngoko', 'kromo':'Kromo', 'kromo-ngalik':'Kromo Ngalik' }[comp];
                const modeName = mode==='latin2shawi' ? 'Latin → Shawibet' : 'Shawibet → Latin';
                modeDesc.textContent = `Mode: ${modeName} · ${compName} · ${dir}`;
            }

            // copy
            function copyText(text, label) {
                if(!text) { showToast('Tidak ada teks untuk disalin'); return; }
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`✓ ${label} disalin`);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast(`✓ ${label} disalin`);
                });
            }

            let toastTimer = null;
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            function clearAll() {
                inputText.value = '';
                outputShawibet.value = '';
                outputLatin.value = '';
                state.inputText = '';
                state.outputLatin = '';
                state.outputShawibet = '';
                updateLabelsAndCounts();
                runConversion();
            }

            function swapMode() {
                const current = state.mode;
                const newMode = current === 'latin2shawi' ? 'shawi2latin' : 'latin2shawi';
                state.mode = newMode;
                document.querySelectorAll('#modeGroup button').forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === newMode);
                });
                const inputVal = inputText.value;
                const shawiVal = outputShawibet.value;
                const latinVal = outputLatin.value;
                if(newMode === 'shawi2latin') {
                    inputText.value = shawiVal || inputVal;
                } else {
                    inputText.value = (latinVal || inputVal);
                }
                runConversion();
                updateLabelsAndCounts();
            }

            function setLayout(cols) {
                state.layout = cols;
                const container = $('columnsContainer');
                container.classList.remove('col-2','col-3');
                container.classList.add(cols===2 ? 'col-2' : 'col-3');
                document.querySelectorAll('#layoutGroup button').forEach(b => {
                    b.classList.toggle('active', parseInt(b.dataset.layout) === cols);
                });
                updateLabelsAndCounts();
                runConversion();
            }

            function toggleTheme() {
                const html = document.documentElement;
                const current = html.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                document.querySelector('#themeToggle').textContent = next === 'dark' ? '🌙 Dark' : '☀ Light';
            }

            function initTheme() {
                const stored = localStorage.getItem('theme');
                if(stored) {
                    document.documentElement.setAttribute('data-theme', stored);
                    document.querySelector('#themeToggle').textContent = stored === 'dark' ? '🌙 Dark' : '☀ Light';
                }
            }

            function init() {
                initTheme();
                inputText.value = 'buku itu baru';
                runConversion();

                inputText.addEventListener('input', runConversion);

                document.querySelectorAll('#modeGroup button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#modeGroup button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        state.mode = this.dataset.mode;
                        if(state.mode === 'shawi2latin') {
                            inputText.value = outputShawibet.value || state.inputText;
                        } else {
                            inputText.value = state.inputText;
                        }
                        runConversion();
                    });
                });

                document.querySelectorAll('#layoutGroup button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        setLayout(parseInt(this.dataset.layout));
                    });
                });

                document.querySelectorAll('#complexityGroup button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#complexityGroup button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        state.complexity = this.dataset.complex;
                        runConversion();
                    });
                });

                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const target = this.dataset.target;
                        let text = '', label = '';
                        if(target === 'col1') { text = inputText.value; label = 'Input'; }
                        else if(target === 'col2') { text = outputShawibet.value; label = 'Shawibet'; }
                        else if(target === 'col3') { text = outputLatin.value; label = 'Shawilang Latin'; }
                        if(text) copyText(text, label);
                        else showToast('Tidak ada teks');
                    });
                });

                $('swapBtn').addEventListener('click', swapMode);
                $('clearBtn').addEventListener('click', clearAll);
                $('convertBtn').addEventListener('click', runConversion);
                $('themeToggle').addEventListener('click', toggleTheme);

                $('year').textContent = new Date().getFullYear();
                setLayout(2);
            }

            if(document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
